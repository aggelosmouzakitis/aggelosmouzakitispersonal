<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"How does working with Aggelos Mouzakitis work?","acceptedAnswer":{"@type":"Answer","text":"It runs in three steps. First a free fit call of about 15 minutes to see if we click. Then a paid session where you bring the problem the way you see it and we find the one that is actually brewing underneath it; you leave with a clear read and one real move. Then ongoing work, private and one to one, but only for as long as it is genuinely useful."}},{"@type":"Question","name":"What does the ongoing work involve?","acceptedAnswer":{"@type":"Answer","text":"It runs on two tracks at the same time. The inner track finds the pattern actually driving the problem and works to rewire it. The business track is the decision in front of you, the move you need to make, the plan for where you are going. Between sessions I study our calls, we might monitor your biomarkers together, and I set exercises and diagnostics so there is a benchmark in place."}},{"@type":"Question","name":"How often are sessions?","acceptedAnswer":{"@type":"Answer","text":"Weekly for the first few months to build momentum and trust, so the work compounds instead of resetting every session. After that it is flexible and spaced out as the rhythm settles. Between sessions you can reach me when something real comes up."}},{"@type":"Question","name":"What does it cost?","acceptedAnswer":{"@type":"Answer","text":"I keep the number of clients small so I can go deep with each one. The work is premium and ongoing, priced as a monthly engagement rather than by the hour. You get the specifics on the fit call."}}]}</script>

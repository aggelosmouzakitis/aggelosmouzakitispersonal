# ─── Book-a-call (Calendly) deactivated → route to the contact page ───────────
# The Calendly booking pages are retired; every "book a call" intent now goes to
# the contact form (orientation interest preselected). force=true wins over the
# existing /book/ index.html, which is kept in the repo but no longer served.
[[redirects]]
  from = "/book"
  to = "/contact?interest=orientation"
  status = 301
  force = true
[[redirects]]
  from = "/book/*"
  to = "/contact?interest=orientation"
  status = 301
  force = true
[[redirects]]
  from = "/el/book"
  to = "/el/"
  status = 301
  force = true
[[redirects]]
  from = "/el/book/*"
  to = "/el/"
  status = 301
  force = true

# ─── Greek "Ask Me Anything" — exact QR-code URL (no trailing slash) ──────────
# The printed QR code points to /ask-me-anything/el exactly. Serve the Greek
# page directly at that path with a 200 rewrite so the URL stays as-is (no
# redirect to a trailing slash). The trailing-slash form still resolves normally
# via the directory index.
[[redirects]]
  from = "/ask-me-anything/el"
  to = "/ask-me-anything/el/index.html"
  status = 200
  force = true

# ─── Hot Seat coworking PDF — clean link that opens the PDF ───────────────────
# Serve the PDF bytes directly at /hot-seat-coworking-spaces (200 rewrite = keep
# the URL; force = win over the directory's index.html) so the link opens the PDF
# in the browser's native viewer. Both bare and trailing-slash forms resolve in
# one hop; the directory's index.html stays as a fallback for other environments.
# The page is kept out of search via X-Robots-Tag below (not in sitemap/prerender).
[[redirects]]
  from = "/hot-seat-coworking-spaces"
  to = "/hot-seat-coworking-spaces/hot-seat-coworking.pdf"
  status = 200
  force = true
[[redirects]]
  from = "/hot-seat-coworking-spaces/"
  to = "/hot-seat-coworking-spaces/hot-seat-coworking.pdf"
  status = 200
  force = true

# ─────────────────────────────────────────────────────────────────────────────
# Headers
# ─────────────────────────────────────────────────────────────────────────────

# Cache static assets for 1 year (immutable)
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Keep non-content resources out of the index (crawlable so the noindex is seen)
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/blog/posts.json"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/blog/post-template.html"
  [headers.values]
    X-Robots-Tag = "noindex"

# Hot Seat coworking PDF — keep the page and the PDF out of search indexes.
# Covers the clean URL, its trailing-slash form, and the underlying file so the
# noindex applies whether the header is matched against the request or the rewrite target.
[[headers]]
  for = "/hot-seat-coworking-spaces"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/hot-seat-coworking-spaces/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

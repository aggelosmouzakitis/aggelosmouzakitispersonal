# ─── Writing (/blog/) — one rule per old essay ───────────────────────────────────
# /blog/ is the live Writing hub. Each old essay goes to the canonical page that
# covers its main subject (301), or is gone (410) where no page does; the reason
# for each is in scripts/seo/routes.js. force = false on purpose: publishing an
# essay again as blog/<slug>/index.html (listed in scripts/seo/site-meta.js, so
# it is published and in the sitemap) makes Netlify serve it at its original
# URL and skip its rule, with no other change here; tidy the rule away then.
# The four essays the canonical copy features on /blog/ are published again
# that way (scripts/articles/articles.js), so their rules are gone.
# There is no /blog/* rule, so a slug that never existed is a 404.
#
# This essay was substantively rewritten as the guide /high-functioning-burnout/

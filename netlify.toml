# ─────────────────────────────────────────────────────────────────────────────
# Repositioning migration — legacy persona/service URLs → new architecture.
# See site-unification/04-redirect-map.csv. All 301, force=true so the redirect
# wins even though the old index.html files still exist. Bare + splat forms are
# both listed so /founders and /founders/ each resolve in a single hop.
# ─────────────────────────────────────────────────────────────────────────────

# ─── Greek (/el/) pages unpublished → English homepage ───────────────────────
# All Greek-language pages are retired. force=true so the redirect wins over the
# still-present /el/*/index.html files, in a single hop. NOTE: /ask-me-anything/el
# is intentionally NOT matched here (it lives outside the /el/ prefix) and stays live.
[[redirects]]
  from = "/el"
  to = "/"
  status = 301
  force = true
[[redirects]]
  from = "/el/*"
  to = "/"
  status = 301
  force = true


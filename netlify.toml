# ─────────────────────────────────────────────────────────────────────────────
# Repositioning migration — legacy persona/service URLs → new architecture.
# See site-unification/04-redirect-map.csv. All 301, force=true so the redirect
# wins even though the old index.html files still exist. Bare + splat forms are
# both listed so /founders and /founders/ each resolve in a single hop.
# ─────────────────────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────────────────────
# Logout Club microsite — logoutclub.gr + logoutclub.aggelosmouzakitis.com
# -----------------------------------------------------------------------------
# Both domains are aliases of THIS Netlify site (add them under Site settings →
# Domain management). The microsite lives in /logoutclub/ and is served at the
# ROOT of each Logout Club host via a domain-scoped rewrite (status 200 = keep
# the URL; force = win even though / maps to the main site's index.html).
#
# aggelosmouzakitis.com is untouched: these three rules match ONLY the Logout
# Club hosts, and they are listed first so they resolve before any path rule
# below. The microsite uses relative asset paths, so /el/, the CSS/JS, fonts,
# sitemap.xml, robots.txt and og-image.png all resolve under the rewrite.
# (The site also previews directly at aggelosmouzakitis.com/logoutclub/.)
# ─────────────────────────────────────────────────────────────────────────────
[[redirects]]
  from = "https://logoutclub.gr/*"
  to = "/logoutclub/:splat"
  status = 200
  force = true
[[redirects]]
  from = "https://www.logoutclub.gr/*"
  to = "/logoutclub/:splat"
  status = 200
  force = true
[[redirects]]
  from = "https://logoutclub.aggelosmouzakitis.com/*"
  to = "/logoutclub/:splat"
  status = 200
  force = true

# how-i-work → 1:1 (core page removed; method content merged into / and /1-to-1/)
[[redirects]]
  from = "/how-i-work"
  to = "/1-to-1/"
  status = 301
  force = true
[[redirects]]
  from = "/how-i-work/*"
  to = "/1-to-1/"
  status = 301
  force = true

# el/how-i-work → el/1-to-1 (Greek method page merged into the Greek offer page)
[[redirects]]
  from = "/el/how-i-work"
  to = "/el/1-to-1/"
  status = 301
  force = true
[[redirects]]
  from = "/el/how-i-work/*"
  to = "/el/1-to-1/"
  status = 301
  force = true

# NOTE: /founders/, /solopreneurs/, /therapy-for-founders/, /therapy-for-executives/,
# /imposter-syndrome-therapy/, /executive-burnout-therapy/ and /career-transition-therapy/
# were previously 301'd here. They are now restored as indexable SEO landing pages
# (200, self-canonical, in sitemap.xml + prerender), so their redirects were removed.

# ─── Pre-existing retired pages ──────────────────────────────────────────────
[[redirects]]
  from = "/schedule"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/schedule/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/faqs"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/faqs/*"
  to = "/"
  status = 301
  force = true

# ─── Burnout Diagnostic → Starting Diagnostic (replaced) ─────────────────────
[[redirects]]
  from = "/burnout-diagnostic"
  to = "/startingdiagnostic/"
  status = 301
  force = true
[[redirects]]
  from = "/burnout-diagnostic/*"
  to = "/startingdiagnostic/"
  status = 301
  force = true
[[redirects]]
  from = "/el/burnout-diagnostic"
  to = "/el/startingdiagnostic/"
  status = 301
  force = true
[[redirects]]
  from = "/el/burnout-diagnostic/*"
  to = "/el/startingdiagnostic/"
  status = 301
  force = true

# ─── Greek "Ask Me Anything" — exact QR-code URL (no trailing slash) ──────────
# The printed QR code points to /ask-me-anything/el exactly. Serve the Greek
# page directly at that path with a 200 rewrite so the URL stays as-is (no
# redirect to a trailing slash). The trailing-slash form still resolves normally
# via the directory index.
[[redirects]]
  from = "/ask-me-anything/el"
  to = "/ask-me-anything/el/index.html"
  status = 200
  force = true

# ─────────────────────────────────────────────────────────────────────────────
# Headers
# ─────────────────────────────────────────────────────────────────────────────

# Cache static assets for 1 year (immutable)
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Logout Club microsite — fingerprinted/stable assets stay immutable
[[headers]]
  for = "/logoutclub/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
# ...but config.js + logoutclub.js load without a version fingerprint and change
# over time (config.js is meant to be edited to plug in real URLs), so they must
# revalidate instead of inheriting the immutable 1-year cache from /*.js above.
[[headers]]
  for = "/logoutclub/config.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/logoutclub/logoutclub.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Keep non-content resources out of the index (crawlable so the noindex is seen)
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/blog/posts.json"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/blog/post-template.html"
  [headers.values]
    X-Robots-Tag = "noindex"

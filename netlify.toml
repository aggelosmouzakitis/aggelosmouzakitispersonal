# ─────────────────────────────────────────────────────────────────────────────
# Redirects — psychotherapy-first migration (Sep 2026).
#
# One rule per retired URL, each pointing straight at its final page, so every
# old URL resolves in exactly one hop: 301 where a close replacement exists,
# 410 Gone where the page was removed on purpose and nothing replaces it (the
# 410 body is the site's 404 page). force = true so a rule wins over any file
# still on disk. Netlify matches a rule with or without the trailing slash;
# each old URL is listed bare and with /* so /x, /x/ and anything under /x/
# all resolve in that single hop. Specific rules come before the catch-alls
# that share their prefix. scripts/qa-routes.js checks every row against the
# migration table; scripts/seo/seo-check.js emulates these rules.
#
# Not here on purpose:
#   /imposter-syndrome-therapy/  HOLD — still served as it was until its
#                                Search Console / backlink review is done.
#   /hot-seat-coworking-spaces/  unrelated utility PDF (rules further down).
# ─────────────────────────────────────────────────────────────────────────────


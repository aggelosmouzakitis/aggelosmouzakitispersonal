# 301 redirects for retired pages (replaces the old meta-refresh stubs)
[[redirects]]
  from = "/schedule"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/schedule/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/faqs"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/faqs/*"
  to = "/"
  status = 301
  force = true

# Cache static assets for 1 year (immutable)
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Keep non-content resources out of the index (crawlable so the noindex is seen)
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/blog/posts.json"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/blog/post-template.html"
  [headers.values]
    X-Robots-Tag = "noindex"

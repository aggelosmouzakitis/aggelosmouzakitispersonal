# ─────────────────────────────────────────────────────────────────────────────
# Build — publish the public site only.
#
# scripts/build-public.js copies the pages and assets the site serves into
# public/ (an allowlist) and checks every local link in them resolves there.
# Netlify serves public/ alone, so repo internals — scripts/, docs, reports,
# JSX sources, tooling, node_modules — are never reachable. The script uses
# Node built-ins only and copies the committed, prebuilt output.
# ─────────────────────────────────────────────────────────────────────────────
[build]
  command = "node scripts/build-public.js"
  publish = "public"

# ─────────────────────────────────────────────────────────────────────────────
# Redirects — psychotherapy-first migration (Sep 2026).
#
# One rule per URL that really existed, each pointing straight at its final
# page, so every old URL resolves in exactly one hop: 301 where a close
# replacement exists, 410 Gone where the page was removed on purpose and
# nothing replaces it (the 410 body is the site's 404 page). Netlify matches a
# rule with or without the trailing slash, so each URL is listed once, bare.
# There are no catch-alls: a URL that never existed (/el/anything,
# /blog/anything, /founders/anything) is a plain 404. force = true so a rule
# wins over any file still on disk — except the essays, see Writing below.
# scripts/qa-routes.js checks every row against scripts/seo/routes.js;
# scripts/seo/seo-check.js emulates these rules.
# ─────────────────────────────────────────────────────────────────────────────


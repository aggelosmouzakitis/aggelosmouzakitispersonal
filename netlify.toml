# ─────────────────────────────────────────────────────────────────────────────
# Headers
# ─────────────────────────────────────────────────────────────────────────────

# Security headers on every response. No Permissions-Policy: the VideoAsk
# embed on /ask-me-anything/el needs the camera and microphone.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Cache static assets for 1 year (immutable)
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Site icons: fixed names, so one day, not a year. Pages link them with a
# content-hash ?v= (scripts/seo/stamp-assets.js), so a new icon shows at once
# wherever those links are read; the bare URLs (the /favicon.ico browsers
# request on their own, the manifest's icons, link previews) catch up within
# a day instead of keeping a year-old copy.
[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/favicon-16x16.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/favicon-32x32.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/favicon-48x48.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/android-chrome-192x192.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/android-chrome-512x512.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Archive of retired pages — private copies, never indexed.
# /archive/ holds frozen copies of every retired page (scripts/archive/build.js).
# Each page there also carries a robots meta; this header covers the frozen JS,
# CSS and images as well. Crawlable on purpose so the noindex is seen, absent
# from sitemap.xml, and not linked from the live site. The retired URLs
# themselves keep their redirects above, so nothing Google knows changes.
[[headers]]
  for = "/archive"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
[[headers]]
  for = "/archive/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
# Frozen assets are content-hashed, so their URL changes whenever their bytes do.
[[headers]]
  for = "/archive/_assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# /ask-me-anything/el (printed QR codes) — reachable, followed, never indexed.
[[headers]]
  for = "/ask-me-anything/el"
  [headers.values]
    X-Robots-Tag = "noindex, follow"
[[headers]]
  for = "/ask-me-anything/el/*"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

# Hot Seat coworking PDF — keep the page and the PDF out of search indexes.
# Covers the clean URL, its trailing-slash form, and the underlying file so the
# noindex applies whether the header is matched against the request or the rewrite target.
[[headers]]
  for = "/hot-seat-coworking-spaces"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/hot-seat-coworking-spaces/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

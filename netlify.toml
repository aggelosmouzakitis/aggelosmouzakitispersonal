# ─── Writing (/blog/) ────────────────────────────────────────────────────────────
# /blog/ is the live Writing hub. force = false, so this rule only applies
# where no page exists: the old essays (not restored yet) land on the hub,
# while /blog/ itself and any essay restored later as blog/<slug>/index.html
# are served normally without touching this file.
[[redirects]]
  from = "/blog/*"
  to = "/blog/"
  status = 301
  force = false

# ─── Hot Seat coworking PDF — clean link that opens the PDF ──────────────────────
# Serve the PDF bytes directly at /hot-seat-coworking-spaces (200 rewrite =
# keep the URL; force = win over the directory's index.html). Kept out of
# search by the X-Robots-Tag header below.
[[redirects]]
  from = "/hot-seat-coworking-spaces"
  to = "/hot-seat-coworking-spaces/hot-seat-coworking.pdf"
  status = 200
  force = true
[[redirects]]
  from = "/hot-seat-coworking-spaces/"
  to = "/hot-seat-coworking-spaces/hot-seat-coworking.pdf"
  status = 200
  force = true

# ─────────────────────────────────────────────────────────────────────────────
# Headers
# ─────────────────────────────────────────────────────────────────────────────

# Cache static assets for 1 year (immutable)
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Keep non-content resources out of the index (crawlable so the noindex is seen)
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/blog/posts.json"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/blog/post-template.html"
  [headers.values]
    X-Robots-Tag = "noindex"

# Archive of retired pages — private copies, never indexed.
# /archive/ holds frozen copies of every retired page (scripts/archive/build.js).
# Each page there also carries a robots meta; this header covers the frozen JS,
# CSS and images as well. Crawlable on purpose so the noindex is seen, absent
# from sitemap.xml, and not linked from the live site. The retired URLs
# themselves keep their redirects above, so nothing Google knows changes.
[[headers]]
  for = "/archive"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
[[headers]]
  for = "/archive/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
# Frozen assets are content-hashed, so their URL changes whenever their bytes do.
[[headers]]
  for = "/archive/_assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Hot Seat coworking PDF — keep the page and the PDF out of search indexes.
# Covers the clean URL, its trailing-slash form, and the underlying file so the
# noindex applies whether the header is matched against the request or the rewrite target.
[[headers]]
  for = "/hot-seat-coworking-spaces"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/hot-seat-coworking-spaces/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

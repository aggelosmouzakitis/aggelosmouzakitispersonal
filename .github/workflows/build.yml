name: Build JSX

# Auto-compiles the .jsx source files into the .js files the browser loads.
# Runs whenever a .jsx file (or the build config) changes on main.
on:
  push:
    branches: [main]
    paths:
      - '**.jsx'
      - '.babelrc'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build.yml'

# Allow the workflow to push the regenerated .js files back to the repo
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Compile JSX → JS
        run: npm run build

      - name: Commit regenerated JS (if anything changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain '*.js')" ]; then
            git add '*.js'
            git commit -m "chore: rebuild JS from JSX [skip ci]"
            git push
          else
            echo "No JS changes to commit."
          fi

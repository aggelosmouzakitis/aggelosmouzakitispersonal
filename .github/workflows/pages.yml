name: Deploy staging preview to GitHub Pages

# Staging deploy of this branch to GitHub Pages.
# Excludes /blog/ per request — everything else ships as-is.
# Scoped push trigger (not workflow_dispatch) since workflow_dispatch only
# works for workflow files already present on the repo's default branch.
on:
  push:
    branches: [claude/site-metadata-schema-rewrite-epm1bo]
    paths:
      - '.github/workflows/pages.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble Pages artifact (site minus /blog/)
        run: |
          mkdir -p _site
          rsync -a --exclude 'blog' --exclude '.git' --exclude '.github' --exclude 'node_modules' --exclude '_site' --exclude 'scripts' ./ _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
